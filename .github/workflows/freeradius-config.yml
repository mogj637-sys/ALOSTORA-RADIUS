name: FreeRADIUS configuration

on:
  push:
    branches: [main]
  pull_request:

jobs:
  config-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build FreeRADIUS image
        run: docker build -t alostora-freeradius:ci ./freeradius

      - name: Validate FreeRADIUS configuration
        run: |
          docker run --rm \
            -e RADIUS_INTERNAL_API_KEY=ci-only-radius-internal-key-012345678901234567890 \
            --entrypoint freeradius \
            alostora-freeradius:ci -XC

      - name: Validate dynamic NAS client generator
        run: |
          printf '%s' '{"clients":[{"nas_identifier":"ci-router-01","ipaddr":"192.0.2.10/32","shortname":"ci-router-01","secret":"ci-test-secret-with-quote-\"-and-backslash-\\"}]}' \
            | docker run --rm -i --entrypoint python3 alostora-freeradius:ci /usr/local/bin/alostora-generate-radius-clients
