services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-alostora_radius}
      POSTGRES_USER: ${POSTGRES_USER:-alostora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-local-development-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-alostora} -d ${POSTGRES_DB:-alostora_radius}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://alostora:change-this-local-development-password@db:5432/alostora_radius}
      APP_ENV: ${APP_ENV:-development}
      APP_SECRET_KEY: ${APP_SECRET_KEY:-development-only-change-me}
      JWT_ACCESS_TOKEN_MINUTES: ${JWT_ACCESS_TOKEN_MINUTES:-30}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:-}
      ROUTER_SECRET_ENCRYPTION_KEY: ${ROUTER_SECRET_ENCRYPTION_KEY:-}
      RADIUS_INTERNAL_API_KEY: ${RADIUS_INTERNAL_API_KEY:-}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12

  freeradius:
    build:
      context: ./freeradius
    restart: unless-stopped
    environment:
      RADIUS_INTERNAL_API_KEY: ${RADIUS_INTERNAL_API_KEY:-}
      RADIUS_API_URL: http://api:8000/internal/radius/clients
    ports:
      - "1812:1812/udp"
      - "1813:1813/udp"
    depends_on:
      api:
        condition: service_healthy

  web:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - api

volumes:
  postgres_data:

  radius:
    build:
      context: ./radius
    environment:
      RADIUS_INTERNAL_API_KEY: ${RADIUS_INTERNAL_API_KEY:-}
    depends_on:
      api:
        condition: service_started
    ports:
      - "1812:1812/udp"
      - "1813:1813/udp"
    restart: unless-stopped
